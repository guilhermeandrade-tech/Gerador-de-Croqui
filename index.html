<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerador de Croqui Técnico — AutoInsp</title>
  <style>
    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #22263a;
      --border: #2e3352;
      --accent: #4f6ef7;
      --accent-hover: #3a57e8;
      --text: #e8eaf0;
      --text-muted: #7a82a8;
      --success: #3ecf8e;
      --error: #e74c3c;
      --radius: 10px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 24px 16px 60px;
    }

    header {
      max-width: 900px;
      margin: 0 auto 32px;
      display: flex;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 20px;
    }

    header .icon {
      width: 44px; height: 44px;
      background: var(--accent);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 22px;
      flex-shrink: 0;
    }

    header h1 { font-size: 1.3rem; font-weight: 700; line-height: 1.2; }
    header p { font-size: 0.8rem; color: var(--text-muted); margin-top: 3px; }

    .container { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
    }

    .card-title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-title::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .full { grid-column: 1 / -1; }

    .field { display: flex; flex-direction: column; gap: 6px; }

    label {
      font-size: 0.78rem;
      color: var(--text-muted);
      font-weight: 500;
    }

    input[type="text"], select, textarea {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-size: 0.85rem;
      padding: 9px 12px;
      outline: none;
      transition: border-color 0.2s;
      font-family: inherit;
      width: 100%;
    }

    input[type="text"]:focus, select:focus, textarea:focus {
      border-color: var(--accent);
    }

    select option { background: var(--surface2); }
    textarea { resize: vertical; min-height: 80px; }

    .veiculo-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .veiculo-tab {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 6px 16px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .veiculo-tab.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .veiculo-panel { display: none; }
    .veiculo-panel.active { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }

    .add-veiculo {
      background: transparent;
      border: 1px dashed var(--border);
      border-radius: 7px;
      padding: 6px 14px;
      font-size: 0.8rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .add-veiculo:hover { border-color: var(--accent); color: var(--accent); }

    .btn-generate {
      background: var(--accent);
      border: none;
      border-radius: var(--radius);
      color: #fff;
      font-size: 1rem;
      font-weight: 700;
      padding: 14px 32px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      justify-content: center;
    }

    .btn-generate:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-generate:active:not(:disabled) { transform: scale(0.98); }
    .btn-generate:disabled { opacity: 0.5; cursor: not-allowed; }

    .spinner {
      width: 20px; height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .resultado-card { display: none; }
    .resultado-card.visible { display: block; }

    .resultado-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .resultado-header h3 { font-size: 0.9rem; font-weight: 600; }

    .btn-download {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--text);
      font-size: 0.8rem;
      padding: 7px 14px;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn-download:hover { border-color: var(--accent); color: var(--accent); }

    #imagem-gerada {
      width: 100%;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      display: block;
      margin-bottom: 14px;
    }

    .prompt-preview {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
    }

    .prompt-preview summary {
      font-size: 0.78rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .prompt-preview pre {
      margin-top: 12px;
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
    }

    .error-box {
      background: rgba(231,76,60,0.1);
      border: 1px solid rgba(231,76,60,0.4);
      border-radius: var(--radius);
      padding: 14px 16px;
      font-size: 0.85rem;
      color: var(--error);
      display: none;
    }

    .error-box.visible { display: block; }

    hr { border: none; border-top: 1px solid var(--border); margin: 14px 0; }
  </style>
</head>
<body>

<header>
  <div class="icon">🚗</div>
  <div>
    <h1>Gerador de Croqui Técnico de Sinistro Veicular</h1>
    <p>AutoInsp · Preencha o formulário e gere o croqui pericial com IA</p>
  </div>
</header>

<div class="container">

  <!-- VIA -->
  <div class="card">
    <div class="card-title">🛣️ Configuração da Via</div>
    <div class="grid">
      <div class="field">
        <label>Tipo de Via</label>
        <select id="tipo-via">
          <option value="">Selecione...</option>
          <option>Via urbana asfaltada</option>
          <option>Rodovia asfaltada</option>
          <option>Estrada de terra</option>
          <option>Estrada rural</option>
          <option>Cruzamento</option>
          <option>Rotatória</option>
          <option>Ponte</option>
          <option>Acesso lateral</option>
        </select>
      </div>
      <div class="field">
        <label>Configuração da Via</label>
        <select id="config-via">
          <option value="">Selecione...</option>
          <option>Mão única</option>
          <option>Mão dupla</option>
          <option>Pista simples</option>
          <option>Pista dupla</option>
          <option>Com acostamento</option>
          <option>Sem acostamento</option>
          <option>Com curva</option>
        </select>
      </div>
      <div class="field">
        <label>Sentido da Via</label>
        <input type="text" id="sentido-via" placeholder="Ex: Norte → Sul, Leste → Oeste" />
      </div>
      <div class="field">
        <label>Nº de Faixas por Sentido</label>
        <select id="qtd-faixas">
          <option value="">Selecione...</option>
          <option>1 faixa</option>
          <option>2 faixas</option>
          <option>3 faixas</option>
          <option>4 ou mais faixas</option>
        </select>
      </div>
    </div>
  </div>

  <!-- VEÍCULOS -->
  <div class="card">
    <div class="card-title">🚙 Veículos Envolvidos</div>

    <div class="veiculo-tabs" id="tabs-container">
      <button class="veiculo-tab active" onclick="trocarTab(0)">V1</button>
      <button class="veiculo-tab" onclick="trocarTab(1)">V2</button>
      <button class="add-veiculo" id="btn-add-v3" onclick="adicionarV3()">+ V3</button>
    </div>

    <!-- V1 -->
    <div class="veiculo-panel active" id="painel-v1">
      <div class="field">
        <label>Modelo / Tipo (V1)</label>
        <select id="v1-modelo">
          <option value="">Selecione...</option>
          <option>Sedan</option><option>Hatch</option><option>SUV</option>
          <option>Caminhão</option><option>Motocicleta</option><option>Ônibus</option>
          <option>Utilitário</option><option>Carreta</option><option>Bicicleta</option>
          <option>Caminhonete</option>
        </select>
      </div>
      <div class="field">
        <label>Cor (V1)</label>
        <input type="text" id="v1-cor" placeholder="Ex: Branco, Prata, Vermelho" />
      </div>
      <div class="field">
        <label>Sentido de Deslocamento (V1)</label>
        <input type="text" id="v1-sentido" placeholder="Ex: Norte para Sul" />
      </div>
      <div class="field">
        <label>Faixa Inicial (V1)</label>
        <input type="text" id="v1-faixa" placeholder="Ex: Faixa da direita" />
      </div>
      <div class="field full">
        <label>Danos (V1)</label>
        <input type="text" id="v1-danos" placeholder="Ex: Dianteiro esquerdo, lateral direita" />
      </div>
    </div>

    <!-- V2 -->
    <div class="veiculo-panel" id="painel-v2" style="display:none">
      <div class="field">
        <label>Modelo / Tipo (V2)</label>
        <select id="v2-modelo">
          <option value="">Selecione...</option>
          <option>Sedan</option><option>Hatch</option><option>SUV</option>
          <option>Caminhão</option><option>Motocicleta</option><option>Ônibus</option>
          <option>Utilitário</option><option>Carreta</option><option>Bicicleta</option>
          <option>Caminhonete</option>
        </select>
      </div>
      <div class="field">
        <label>Cor (V2)</label>
        <input type="text" id="v2-cor" placeholder="Ex: Preto, Azul" />
      </div>
      <div class="field">
        <label>Sentido de Deslocamento (V2)</label>
        <input type="text" id="v2-sentido" placeholder="Ex: Sul para Norte" />
      </div>
      <div class="field">
        <label>Faixa Inicial (V2)</label>
        <input type="text" id="v2-faixa" placeholder="Ex: Faixa da esquerda" />
      </div>
      <div class="field full">
        <label>Danos (V2)</label>
        <input type="text" id="v2-danos" placeholder="Ex: Traseiro central" />
      </div>
    </div>

    <!-- V3 (oculto por padrão) -->
    <div class="veiculo-panel" id="painel-v3" style="display:none">
      <div class="field">
        <label>Modelo / Tipo (V3)</label>
        <select id="v3-modelo">
          <option value="">Selecione...</option>
          <option>Sedan</option><option>Hatch</option><option>SUV</option>
          <option>Caminhão</option><option>Motocicleta</option><option>Ônibus</option>
          <option>Utilitário</option><option>Carreta</option><option>Bicicleta</option>
          <option>Caminhonete</option>
        </select>
      </div>
      <div class="field">
        <label>Cor (V3)</label>
        <input type="text" id="v3-cor" placeholder="Ex: Azul" />
      </div>
      <div class="field">
        <label>Sentido de Deslocamento (V3)</label>
        <input type="text" id="v3-sentido" placeholder="Ex: Leste para Oeste" />
      </div>
      <div class="field">
        <label>Faixa Inicial (V3)</label>
        <input type="text" id="v3-faixa" placeholder="Ex: Faixa central" />
      </div>
      <div class="field full">
        <label>Danos (V3)</label>
        <input type="text" id="v3-danos" placeholder="Ex: Lateral esquerda" />
      </div>
    </div>
  </div>

  <!-- DINÂMICA -->
  <div class="card">
    <div class="card-title">📋 Dinâmica do Sinistro</div>
    <div class="grid">
      <div class="field full">
        <label>Relato do Sinistro</label>
        <textarea id="relato" rows="4" placeholder="Descreva como o sinistro ocorreu..."></textarea>
      </div>
      <div class="field">
        <label>Evento Inicial</label>
        <input type="text" id="evento-inicial" placeholder="Ex: Perda de controle, colisão traseira" />
      </div>
      <div class="field">
        <label>Lado do Desvio / Perda de Controle</label>
        <select id="lado-desvio">
          <option value="">Selecione...</option>
          <option>Esquerda (do veículo)</option>
          <option>Direita (do veículo)</option>
          <option>Não houve desvio</option>
          <option>Não informado</option>
        </select>
      </div>
      <div class="field full">
        <label>Movimento Após o Evento</label>
        <input type="text" id="movimento-apos" placeholder="Ex: Derrapou para a direita, colidiu contra muro" />
      </div>
      <div class="field">
        <label>Elemento Atingido</label>
        <input type="text" id="elemento-atingido" placeholder="Ex: Poste, muro, valeta, outro veículo" />
      </div>
      <div class="field">
        <label>Posição Final</label>
        <input type="text" id="posicao-final" placeholder="Ex: Lateral esquerda na valeta" />
      </div>
      <div class="field full">
        <label>Detalhamento da Posição Final</label>
        <textarea id="detalhe-posicao" rows="2" placeholder="Ex: Dianteira esquerda dentro da valeta, traseira sobre a faixa de rodagem"></textarea>
      </div>
      <div class="field full">
        <label>Observações Adicionais</label>
        <textarea id="observacoes" rows="2" placeholder="Qualquer informação complementar relevante..."></textarea>
      </div>
    </div>
  </div>

  <!-- BOTÃO GERAR -->
  <button class="btn-generate" id="btn-gerar" onclick="gerarCroqui()">
    <span class="spinner" id="spinner"></span>
    <span id="btn-label">🖼️ Gerar Croqui Técnico</span>
  </button>

  <!-- ERRO -->
  <div class="error-box" id="error-box"></div>

  <!-- RESULTADO -->
  <div class="card resultado-card" id="resultado">
    <div class="resultado-header">
      <h3>🗺️ Croqui Técnico Gerado</h3>
      <a class="btn-download" id="btn-download" href="#" target="_blank" rel="noopener">⬇️ Abrir / Baixar</a>
    </div>
    <img id="imagem-gerada" src="" alt="Croqui Técnico de Sinistro Veicular" />
    <details class="prompt-preview">
      <summary>Ver prompt enviado à IA</summary>
      <pre id="prompt-texto"></pre>
    </details>
  </div>

</div>

<script>
  let v3Ativo = false;

  // ---- TABS ----
  function trocarTab(idx) {
    const ids = ['painel-v1', 'painel-v2', 'painel-v3'];
    const tabs = document.querySelectorAll('.veiculo-tab');
    tabs.forEach((t, i) => t.classList.toggle('active', i === idx));
    ids.forEach((id, i) => {
      const el = document.getElementById(id);
      if (!el) return;
      el.classList.remove('active');
      el.style.display = (i === idx) ? '' : 'none';
      if (i === idx) el.classList.add('active');
    });
  }

  function adicionarV3() {
    v3Ativo = true;
    document.getElementById('btn-add-v3').style.display = 'none';
    const tabs = document.getElementById('tabs-container');
    const btn = document.getElementById('btn-add-v3');
    const newTab = document.createElement('button');
    newTab.className = 'veiculo-tab';
    newTab.textContent = 'V3';
    newTab.onclick = () => trocarTab(2);
    tabs.insertBefore(newTab, btn);
    trocarTab(2);
  }

  // ---- PROMPT ----
  function construirPrompt() {
    const g = id => (document.getElementById(id)?.value || '').trim();

    const veiculosList = ['v1', 'v2', v3Ativo ? 'v3' : null].filter(Boolean);
    const veiculos = veiculosList.map((v, i) => {
      const m = g(`${v}-modelo`), c = g(`${v}-cor`), s = g(`${v}-sentido`), f = g(`${v}-faixa`), d = g(`${v}-danos`);
      return `V${i+1}: ${m||'veículo'}${c?', color '+c:''}${s?', moving toward '+s:''}${f?', lane: '+f:''}${d?', contact area: '+d:''}`;
    }).join('\n');

    const linhas = [
      `Flat overhead technical schematic diagram (bird's-eye view, 90° top-down, no perspective, no 3D, no artistic style) for traffic engineering documentation and insurance assessment purposes.`,
      ``,
      `This is a purely technical 2D diagram similar to a traffic engineering blueprint or road safety audit sketch.`,
      ``,
      `Include a text label in the upper-left corner, left-aligned: CROQUI TÉCNICO DE SINISTRO VEICULAR`,
      ``,
      `The diagram is divided into three vertically stacked labeled panels:`,
      `Panel 1 label: "Fase 1 - Deslocamento inicial"`,
      `Panel 2 label: "Fase 2 - Ponto do evento"`,
      `Panel 3 label: "Fase 3 - Posição final"`,
      ``,
      `ROAD: ${g('tipo-via')||'paved road'}. Layout: ${g('config-via')||'single carriageway'}. Direction: ${g('sentido-via')||'unspecified'}. Lanes per direction: ${g('qtd-faixas')||'1'}.`,
      ``,
      `VEHICLES (top-down view only):`,
      veiculos,
      ``,
      `TRAFFIC FLOW SEQUENCE:`,
      g('relato') ? `Description: ${g('relato')}` : '',
      g('evento-inicial') ? `Initial movement: ${g('evento-inicial')}` : '',
      g('lado-desvio') ? `Direction of deviation: ${g('lado-desvio')}` : '',
      g('movimento-apos') ? `Subsequent movement: ${g('movimento-apos')}` : '',
      g('elemento-atingido') ? `Fixed element in contact: ${g('elemento-atingido')}` : '',
      g('posicao-final') ? `Final resting position: ${g('posicao-final')}` : '',
      g('detalhe-posicao') ? `Position detail: ${g('detalhe-posicao')}` : '',
      g('observacoes') ? `Additional notes: ${g('observacoes')}` : '',
      ``,
      `DIAGRAM REQUIREMENTS:`,
      `- All vehicles shown strictly from directly above (flat top-down 2D, like a map symbol).`,
      `- Road with lane markings, travel directions, shoulders or margins as described.`,
      `- Each vehicle placed exactly in its specified lane.`,
      `- Red directional arrows showing travel path and movement sequence.`,
      `- Panel 1 only: small identification tag beside each vehicle showing V1, V2, V3 only.`,
      `- Panels 2 and 3: no tags, no text boxes, no callouts — only short labels V1/V2/V3 near vehicles.`,
      `- Structural contact areas shown directly on the correct sector of each vehicle, discreetly and schematically.`,
      `- Left and right always from the vehicle's own perspective relative to its direction of travel.`,
      `- Ditches, embankments and shoulders always outside the travel lane.`,
      `- No bottom legend, no side legend, no narrative text, no explanatory labels.`,
      `- No people, no fire, no smoke, no blood, no realistic imagery, no car brand logos, no license plates.`,
      `- Do not add any elements not described in the sequence above.`,
      `- Style: clean flat technical schematic, useful for traffic engineering and insurance documentation.`,
    ].filter(l => l !== null && l !== '');

    return linhas.join('\n').replace(/\n{3,}/g, '\n\n').trim();
  }

  // ---- GERAR ----
  async function gerarCroqui() {
    const errBox = document.getElementById('error-box');
    const resultado = document.getElementById('resultado');
    const spinner = document.getElementById('spinner');
    const btnLabel = document.getElementById('btn-label');
    const btn = document.getElementById('btn-gerar');

    errBox.className = 'error-box';
    resultado.className = 'card resultado-card';

    const prompt = construirPrompt();
    document.getElementById('prompt-texto').textContent = prompt;

    btn.disabled = true;
    spinner.style.display = 'inline-block';
    btnLabel.textContent = 'Gerando croqui... (pode levar até 30s)';

    try {
      const res = await fetch('/api/generate', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt }),
      });

      const data = await res.json();

      if (!res.ok || data.error) {
        throw new Error(data.error || `Erro HTTP ${res.status}`);
      }

      document.getElementById('imagem-gerada').src = data.url;
      document.getElementById('btn-download').href = data.url;
      if (data.safe_prompt) {
        document.getElementById('prompt-texto').textContent =
          '── Prompt original ──\n' + prompt +
          '\n\n── Prompt reescrito pelo GPT-4o (enviado ao DALL-E) ──\n' + data.safe_prompt;
      }
      resultado.classList.add('visible');
      resultado.scrollIntoView({ behavior: 'smooth', block: 'start' });

    } catch (err) {
      errBox.textContent = '❌ ' + err.message;
      errBox.classList.add('visible');
    } finally {
      btn.disabled = false;
      spinner.style.display = 'none';
      btnLabel.textContent = '🖼️ Gerar Croqui Técnico';
    }
  }
</script>

</body>
</html>
